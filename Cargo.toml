[package]
name = "notch-woy"
version = "0.3.0"
edition = "2024"
description = "A Dynamic Island for Windows"
license = "MIT"
repository = "https://github.com/Panskuy/notch-woy"
readme = "README.md"

[dependencies]
ab_glyph = "0.2"
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd"] }
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_System_LibraryLoader", "Win32_Graphics_Dwm", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_System_Registry", "Foundation", "Media_Control", "Storage_Streams", "Graphics_Imaging", "Win32_System_Com", "Web_Http", "Web_Http_Headers", "Data_Json", "Win32_System_Power", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "UI_Notifications_Management", "UI_Notifications", "ApplicationModel", "Win32_UI_Accessibility", "Devices_Bluetooth", "Devices_Enumeration", "Devices_Radios", "Win32_System_Wmi", "Win32_System_Ole", "Win32_Security", "Win32_Devices_Display", "Win32_System_ProcessStatus", "Win32_System_Threading", "Win32_UI_Shell_PropertiesSystem", "Win32_Devices_DeviceAndDriverInstallation", "Win32_Devices_Properties", "Win32_System_SystemServices", "Win32_System_Memory", "Foundation_Collections", "Storage", "ApplicationModel_DataTransfer", "Win32_System_WinRT", "Win32_Globalization", "Win32_System_SystemInformation"] }
# `#[implement]` (COM callbacks in volume.rs) expands to paths in this crate.
windows-core = "0.61"
# `IIterable` from a Vec, for the share sheet's file list (shelf.rs); already
# a dependency of `windows`.
windows-collections = "0.2"

# Unoptimized rendering misses frames (up to ~37 ms each), so `cargo run`
# animations stutter. Optimize dependencies fully and our code lightly.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[dev-dependencies]
# PNG output for the render preview test only.
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd", "png-format"] }

[build-dependencies]
winresource = "0.1"
